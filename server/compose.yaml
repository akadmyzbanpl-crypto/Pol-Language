services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - pol-data:/app/data
    expose:
      - "8000"
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      POL_DOMAIN: ${POL_DOMAIN:?Set POL_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
volumes:
  pol-data:
  caddy-data:
  caddy-config:
